name: Build Yashraj Player (Windows EXE and Installer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 python-mpv pyinstaller

      - name: Download libmpv (video engine, plays every format)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "yashraj-build" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}' } | Select-Object -First 1
          if (-not $asset) { throw "libmpv package was not found in the latest release" }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv_dev -y | Out-Null
          $dll = Get-ChildItem -Path mpv_dev -Recurse -Filter "*mpv*.dll" | Select-Object -First 1
          if (-not $dll) { throw "libmpv dll was not found inside the package" }
          Copy-Item $dll.FullName -Destination "libmpv-2.dll"

      - name: Download FFmpeg (to bundle inside the app)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegDir = Get-ChildItem -Path ffmpeg_extracted -Directory | Select-Object -First 1
          Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" -Destination .

      - name: Download Whisper (auto subtitles, optional)
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path whisper | Out-Null
          Set-Content -Path whisper\.keep -Value "keep"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "yashraj-build" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -eq "whisper-bin-x64.zip" } | Select-Object -First 1
          if (-not $asset) { Write-Host "Whisper package not found. Building without auto subtitles."; exit 0 }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper_tmp
          $exe = Get-ChildItem -Path whisper_tmp -Recurse -Filter "whisper-cli.exe" | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Path whisper_tmp -Recurse -Filter "main.exe" | Select-Object -First 1 }
          if ($exe) { Copy-Item "$($exe.DirectoryName)\*" -Destination whisper -Recurse -Force }

      - name: Make sure the whisper folder exists
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path whisper | Out-Null
          if (-not (Test-Path whisper\.keep)) { Set-Content -Path whisper\.keep -Value "keep" }

      - name: Build app with PyInstaller (fast-starting folder build)
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "YashrajPlayer" --add-binary "libmpv-2.dll;." --add-binary "ffmpeg.exe;." --add-data "whisper;whisper" --hidden-import mpv main.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path dist\YashrajPlayer -DestinationPath YashrajPlayer-portable.zip

      - name: Upload full Installer (recommended)
        uses: actions/upload-artifact@v4
        with:
          name: YashrajPlayer-Setup-Installer
          path: installer_output/YashrajPlayer_Setup.exe

      - name: Upload portable version (no install)
        uses: actions/upload-artifact@v4
        with:
          name: YashrajPlayer-Portable
          path: YashrajPlayer-portable.zip
